.logo i{display:block;width:96px;height:68px;background:var(--ink);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
nav{display:flex;gap:22px;flex-wrap:wrap;margin-inline-start:14px;padding-inline-start:26px;border-inline-start:1px solid var(--line)}header .cart{margin-inline-start:auto}nav a{color:var(--mute);font-weight:500;position:relative;padding:4px 0;transition:color .3s}nav a.on,nav a:hover{color:var(--gold)}nav a::after{content:"";position:absolute;bottom:-1px;left:50%;right:50%;height:2px;border-radius:2px;background:var(--gold);transition:left .3s ease,right .3s ease}nav a:hover::after,nav a.on::after{left:0;right:0}
.cart{background:var(--dark);color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;border:0;cursor:pointer;font-family:inherit}
main{max-width:1100px;margin:auto;padding:24px 20px 60px;overflow:hidden}@supports (overflow:clip){main{overflow:visible;overflow-x:clip}}footer{overflow:hidden}@supports (overflow:clip){footer{overflow:visible;overflow-x:clip}}
.hero{background:#f6f1e8;color:var(--ink);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;align-items:center}
.hero div.t{padding:48px}.hero h1{font-size:40px;line-height:1.3;margin:0 0 12px}.hero p{color:var(--mute);margin:0 0 24px}
.card img{width:100%;height:170px;object-fit:cover;display:block}
.btn{display:inline-block;background:var(--gold);color:#14181f;padding:11px 26px;border-radius:99px;font-weight:700;border:0;cursor:pointer;font-family:inherit;font-size:15px}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold);margin-inline-start:8px}
h2{font-size:28px;margin:48px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s ease,box-shadow .35s ease}.card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(20,24,31,.10)}.card img{transition:transform .7s ease}.card:hover img{transform:scale(1.06)}
.card svg{width:100%;height:150px;display:block}
.card .b{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:17px}.card small{color:var(--mute)}
.price{color:var(--gold);font-weight:800}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.why > div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 22px;transition:transform .35s ease,box-shadow .35s ease}.why > div:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,24,31,.08)}.why .lot{width:76px;height:76px;margin-bottom:10px}.why b{font-size:17px;margin-bottom:4px}.why b{display:block}.why span{color:var(--mute);font-size:15px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.rev .s{color:var(--gold)}
.layout{display:grid;grid-template-columns:200px 1fr;gap:28px}
.side{display:flex;flex-direction:column;gap:4px;border-inline-end:1px solid var(--line);padding-inline-end:16px}
.side a{padding:9px 12px;border-radius:10px;color:var(--mute);cursor:pointer;font-weight:500}.side a.on{background:var(--dark);color:#fff}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:640px;display:grid;gap:14px}
label{font-weight:500;font-size:14px;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{display:flex;flex-wrap:wrap;gap:14px}.chk label{display:flex;align-items:center;gap:6px;font-weight:400}.chk input{width:auto}
